#:schema "https://mise.jdx.dev/schema/mise.json"

[env]

[tools]
cargo-binstall = "1.27.0"
crane = "0.22.1"
difftastic = "0.72.0"
docker-compose = "5.7.1"
fd = "10.5.2"
"forgejo:forgejo-contrib/forgejo-cli" = "0.7.0"
fzf = "0.75.0"
github-cli = "2.104.0"
go = "1.27.4"
helm = "4.3.2"
k9s = "0.51.0"
kubecolor = "0.8.0"
kubectl = "1.37.2"
kubectx = "0.11.0"
kustomize = "5.8.3"
lazygit = "0.66.3"
neovim = "0.12.6"
node = "26.13.1"
python = "3.15.2"
ripgrep = "15.2.0"
rust = "1.100.0"
uv = "0.12.0"

[settings]
experimental = true
pin = true
lockfile = true
idiomatic_version_file_enable_tools = ["python", "rust"]
python.uv_venv_auto = "create|source"

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.config/fuzzel" = { mode = "track" }
"~/.config/harlequin" = { mode = "track" }
"~/.config/k9s" = { mode = "track" }
"~/.config/mise" = { mode = "track" }
"~/.config/niri" = { mode = "track" }
"~/.config/noctalia" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/starship.toml" = { mode = "track" }
"~/.config/wezterm" = { mode = "track" }
"~/.config/zed" = { mode = "track" }
"~/.face" = { mode = "track" }
