[env]

[tools]
argocd = "2.13.3"
aws-cli = { version = "2.28.11", symlink_bins = "true" }
awscli = { version = "2.32.24", symlink_bins = "true" }
"cargo:forgejo-cli" = "0.7.0"
"cargo:loco" = "0.16.2"
"cargo:sea-orm-cli" = "1.1.14"
"cargo:spotatui" = "0.40.2"
cilium-cli = { version = "0.18.6", exe = "cilium" }
cilium-hubble = "1.18.0"
crane = "0.20.6"
difftastic = "0.68.0"
docker-compose = "latest"
fd = "10.2.0"
fzf = "0.65.1"
github-cli = "2.76.2"
"github:cargo-bins/cargo-binstall" = "1.21.1"
"github:kopecmaciej/vi-sql" = "0.2.0"
go = "1.25.0"
golangci-lint = "2.4.0"
helm = "3.18.5"
k9s = "0.50.9"
kube-linter = "0.7.5"
kubecolor = "0.0.25"
kubectl = "1.33.4"
kubectx = "0.9.5"
kubevela = "1.10.3"
kustomize = "5.7.1"
lazygit = "0.54.2"
mongosh = "2.5.6"
neovim = "0.11.3"
node = "24.6.0"
"npm:@earendil-works/pi-coding-agent" = "1.4.0"
oh-my-pi = { version = "17.2.7", rename_exe = "omp" }
openbao = "2.5.0"
"pipx:sqlfluff" = "3.4.2"
powershell-core = "latest"
python = "latest"
ripgrep = "14.1.1"
rustic = "latest"
talosctl = { version = "1.10.6", exe = "talosctl" }
uv = "latest"
vault = "1.20.2"
yamlfmt = "0.17.2"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python", "rust"]
python.uv_venv_auto = "create|source"
cargo.binstall = true
cargo.binstall_native = true
cargo.binstall_only = false
cargo.binstall_quickinstall = true

